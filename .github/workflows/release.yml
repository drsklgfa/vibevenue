name: secure-release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  package:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vibevenue
          POSTGRES_PASSWORD: vibevenue_release_password
          POSTGRES_DB: vibevenue_release
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibevenue -d vibevenue_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://vibevenue:vibevenue_release_password@127.0.0.1:5432/vibevenue_release
      TEST_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://vibevenue:vibevenue_release_password@127.0.0.1:5432/vibevenue_release
      REDIS_URL: redis://127.0.0.1:6379
      TOKEN_HASH_PEPPER: release-only-token-pepper-00000000000000000000
      AUDIT_IP_SALT: release-only-audit-salt-0000000000000000000000
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:offline
      - run: npm run validate:semantic-offline
      - run: npm run security:scan-repository
      - run: npm run security:test-static
      - run: npm run security:test-backup-crypto
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:sbom
      - run: npm run build && npm run typecheck && npm run test && npm run lint && npm run verify:artifacts
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_REALTIME_URL: https://api.example.invalid
      - name: Package source and evidence
        run: |
          mkdir -p release
          git archive --format=zip --output="release/vibevenue-${GITHUB_REF_NAME}.zip" HEAD
          cp artifacts/sbom.cdx.json release/
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Attest release provenance
        if: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_ARTIFACT_ATTESTATION == 'true' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: release/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
