name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vibevenue
          POSTGRES_PASSWORD: vibevenue_test_password
          POSTGRES_DB: vibevenue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibevenue -d vibevenue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://vibevenue:vibevenue_test_password@127.0.0.1:5432/vibevenue_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://vibevenue:vibevenue_test_password@127.0.0.1:5432/vibevenue_test
      REDIS_URL: redis://127.0.0.1:6379
      TOKEN_HASH_PEPPER: ci-only-token-pepper-000000000000000000000000
      AUDIT_IP_SALT: ci-only-audit-salt-00000000000000000000000000
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_REALTIME_URL: http://localhost:4000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - name: Install immutable dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - run: npm run validate:lockfile
      - run: npm run validate:source
      - run: npm run validate:semantic-offline
      - run: npm run security:scan-repository
      - run: npm run security:test-static
      - run: npm run security:test-backup-crypto
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:sbom
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run validate:render
      - run: npm run verify:artifacts
      - run: npm run smoke
