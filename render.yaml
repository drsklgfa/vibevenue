# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: keyvalue
    name: vibevenue-redis-drsklgfa
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: vibevenue-api-drsklgfa
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev --no-audit --no-fund && node scripts/validate-lockfile.mjs && node node_modules/typescript/bin/tsc -p packages/contracts/tsconfig.json && node node_modules/typescript/bin/tsc -p apps/server/tsconfig.json && node scripts/validate-render.mjs && node scripts/verify-artifacts.mjs server
    preDeployCommand: node apps/server/dist/migrate-cli.js
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_MODE
        value: demo
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: WEB_ORIGINS
        fromService:
          type: web
          name: vibevenue-web-drsklgfa
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: vibevenue-db-drsklgfa
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vibevenue-redis-drsklgfa
          property: connectionString
      - key: REQUIRE_CLOUD_SERVICES
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: ADMIN_SESSION_ABSOLUTE_HOURS
        value: "720"
      - key: PLATFORM_SESSION_ABSOLUTE_HOURS
        value: "8"
      - key: ADMIN_SESSION_IDLE_MINUTES
        value: "60"
      - key: PLATFORM_SESSION_IDLE_MINUTES
        value: "30"
      - key: SESSION_TOUCH_MINUTES
        value: "5"
      - key: GUEST_SESSION_TTL_HOURS
        value: "12"
      - key: MAINTENANCE_INTERVAL_MINUTES
        value: "60"
      - key: BILLING_GRACE_DAYS
        value: "5"
      - key: EXPIRED_GUEST_RETENTION_DAYS
        value: "30"
      - key: AUDIT_RETENTION_DAYS
        value: "730"
      - key: AUDIT_IP_SALT
        sync: false
      - key: TOKEN_HASH_PEPPER
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_REQUIRE_ENCRYPTION
        value: "true"
      - key: MFA_ISSUER
        value: VibeVenue
      - key: MFA_REQUIRED_ROLES
        value: owner
      - key: MFA_CHALLENGE_MINUTES
        value: "10"
      - key: MFA_MAX_ATTEMPTS
        value: "5"
      - key: STEP_UP_MINUTES
        value: "10"
      - key: DISTRIBUTED_RATE_LIMIT
        value: "true"
      - key: MEDIA_SCAN_MODE
        value: optional
      - key: CLAMAV_HOST
        value: ""
      - key: CLAMAV_PORT
        value: "3310"
      - key: EMAIL_PROVIDER
        value: disabled
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_PUBLIC_URL
        fromService:
          type: web
          name: vibevenue-web-drsklgfa
          envVarKey: RENDER_EXTERNAL_URL
      - key: SECURITY_CONTACT_EMAIL
        sync: false
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: READ_ONLY_MODE
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: RETURN_ADMIN_TOKEN
        value: "false"
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: ./apps/server/uploads

  - type: web
    name: vibevenue-web-drsklgfa
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev --no-audit --no-fund && node scripts/validate-lockfile.mjs && node node_modules/typescript/bin/tsc -p packages/contracts/tsconfig.json && cd apps/web && node ../../node_modules/next/dist/bin/next build --turbopack && cd ../.. && node scripts/verify-artifacts.mjs web
    startCommand: node scripts/serve-static.mjs apps/web/out
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: vibevenue-api-drsklgfa
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_REALTIME_URL
        fromService:
          type: web
          name: vibevenue-api-drsklgfa
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: vibevenue-db-drsklgfa
    plan: free
    region: oregon
    databaseName: vibevenue
    user: vibevenue
    ipAllowList: []
